<script>
(async () => {
    const params = new URLSearchParams(location.search);
    const type = params.get('type');
    const slug = params.get('slug');

    const map = {
        'Project': 'content/projects/project-1.json',
        'Case Study': 'content/case-studies/case-study-1.json',
        'Insight': 'content/insights/insight-1.json',
        'Resource': 'content/resources/resource-1.json'
    };

    const detail = document.getElementById('detail');

    if (!type || !slug || !map[type]) {
        detail.innerHTML = `
            <div class="detail-shell">
                <div class="eyebrow">404</div>
                <h1>Not found.</h1>
                <p class="lead">This Library item does not exist.</p>
            </div>
        `;
        return;
    }

    try {
        const r = await fetch(map[type]);

        if (!r.ok) {
            throw new Error(`HTTP ${r.status}`);
        }

        const x = await r.json();

        /*
         * Make sure the requested slug matches the JSON being loaded.
         * This prevents the wrong item from being displayed later.
         */
        if (x.slug && x.slug !== slug) {
            throw new Error('Slug mismatch');
        }

        document.title = `${x.title} — VikFlow Library`;

        const esc = (s) =>
            String(s || '').replace(/[&<>"']/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[c]));

        const tags = (x.tags || [])
            .map(t => `<span class="tag">${esc(t)}</span>`)
            .join('');

        const hero = x.heroImage
            ? `
                <figure class="detail-hero">
                    <img
                        src="${esc(x.heroImage)}"
                        alt="${esc(x.heroAlt || x.title)}"
                    >
                </figure>
            `
            : '';

        const gallery = x.gallery && x.gallery.length
            ? `
                <div class="detail-gallery">
                    ${x.gallery.map((src, i) => `
                        <figure class="section-image">
                            <img
                                src="${esc(src)}"
                                alt="${esc((x.title || '') + ' image ' + (i + 1))}"
                                loading="lazy"
                            >
                        </figure>
                    `).join('')}
                </div>
            `
            : '';

        let html = `
            <article class="detail-shell">
                <div class="eyebrow">
                    ${esc(x.type)} · ${esc(x.date)}
                    ${x.readTime ? ' · ' + esc(x.readTime) : ''}
                </div>

                <h1>${esc(x.title)}</h1>

                <p class="lead">${esc(x.excerpt)}</p>

                ${hero}

                <div class="tag-row">
                    ${tags}
                </div>
        `;

        if (x.sections) {
            html += x.sections.map(s => `
                <section class="section">

                    ${s.image ? `
                        <figure class="section-image">
                            <img
                                src="${esc(s.image)}"
                                alt="${esc(s.imageAlt || s.heading)}"
                                loading="lazy"
                            >
                        </figure>
                    ` : ''}

                    <h2>${esc(s.heading)}</h2>

                    ${(s.paragraphs || [])
                        .map(p => `<p>${esc(p)}</p>`)
                        .join('')}
                </section>
            `).join('');
        }

        html += gallery;

        if (x.type === 'Resource') {
            html += `
                <div class="download-panel">
                    <div>
                        <span class="mono-label">RESOURCE</span>
                        <h3>${esc(x.title)}</h3>
                        <p>Get the resource through Payhip.</p>
                    </div>

                    <a
                        class="btn btn-dark"
                        href="${esc(x.payhipUrl || '#')}"
                        target="_blank"
                        rel="noopener"
                    >
                        ${esc(x.ctaLabel || 'Get the resource')}
                    </a>
                </div>
            `;
        }

        html += '</article>';

        detail.innerHTML = html;

    } catch (e) {
        console.error('Could not load Library item:', e);

        detail.innerHTML = `
            <div class="detail-shell">
                <div class="eyebrow">Error</div>
                <h1>Could not load this item.</h1>
                <p class="lead">
                    The Library item could not be loaded.
                </p>
            </div>
        `;
    }
})();
</script>
