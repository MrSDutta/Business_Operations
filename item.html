<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FAF7EF"><meta name="description" content="VikFlow Library item"><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/styles.css"><title>VikFlow Library</title></head><body>
<header class="site-header" id="siteHeader"><div class="wrap bar"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="VikFlow"><span class="brand-word">VikFlow<span>.</span></span></a><div class="action"><a class="btn btn-light" href="index.html">← Library</a><button class="btn btn-dark" data-help>Need help?</button></div></div></header>
<main class="wrap detail-page"><div id="detail"></div></main>
<footer class="footer"><div class="wrap">VikFlow Library · An extension of <a href="https://www.vikflow.com/">vikflow.com</a></div></footer>
<div class="modal-backdrop" id="helpModal"><div class="modal"><div class="eyebrow">Need help?</div><h2>Let's talk about the problem.</h2><p>Tell me what you're trying to improve, build or untangle.</p><form id="helpForm"><label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Message</label><textarea name="message" required></textarea><div class="modal-actions"><button type="button" class="btn btn-light" data-close>Close</button><button class="btn btn-dark">Send</button></div><div class="status" id="helpStatus"></div></form></div></div>
<script src="js/config.js"></script><script src="js/main.js"></script><script>
(async()=>{const p=new URLSearchParams(location.search),type=p.get('type'),slug=p.get('slug');const map={'Project':'content/projects/','Case Study':'content/case-studies/','Insight':'content/insights/','Resource':'content/resources/'};const detail=document.getElementById('detail');if(!type||!slug||!map[type]){detail.innerHTML='<div class="detail-shell"><div class="eyebrow">404</div><h1>Not found.</h1><p class="lead">This Library item does not exist.</p></div>';return;}try{const r=await fetch(map[type]+slug+'.json');if(!r.ok)throw new Error();const x=await r.json();document.title=x.title+' — VikFlow Library';const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const tags=(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');const hero=x.heroImage?`<figure class="detail-hero"><img src="${esc(x.heroImage)}" alt="${esc(x.heroAlt||x.title)}"></figure>`:'';const gallery=x.gallery&&x.gallery.length?`<div class="detail-gallery">${x.gallery.map((src,i)=>`<figure class="section-image"><img src="${esc(src)}" alt="${esc((x.title||'')+' image '+(i+1))}" loading="lazy"></figure>`).join('')}</div>`:'';let html='<article class="detail-shell"><div class="eyebrow">'+esc(x.type)+' · '+esc(x.date)+(x.readTime?' · '+esc(x.readTime):'')+'</div><h1>'+esc(x.title)+'</h1><p class="lead">'+esc(x.excerpt)+'</p>'+hero+'<div class="tag-row">'+tags+'</div>';if(x.sections){html+=x.sections.map(s=>'<section class="section">'+(s.image?`<figure class="section-image"><img src="${esc(s.image)}" alt="${esc(s.imageAlt||s.heading)}" loading="lazy"></figure>`:'')+'<h2>'+esc(s.heading)+'</h2>'+s.paragraphs.map(p=>'<p>'+esc(p)+'</p>').join('')+'</section>').join('');}html+=gallery;if(x.type==='Resource'){html+='<div class="download-panel"><div><span class="mono-label">RESOURCE</span><h3>'+esc(x.title)+'</h3><p>Get the resource through Payhip.</p></div><a class="btn btn-dark" href="'+esc(x.payhipUrl||'#')+'" target="_blank" rel="noopener">'+esc(x.ctaLabel||'Get the resource')+'</a></div>'; }html+='</article>';detail.innerHTML=html;}catch(e){detail.innerHTML='<div class="detail-shell"><div class="eyebrow">Error</div><h1>Could not load this item.</h1><p class="lead">Check the JSON filename and path.</p></div>';}})();
</script></body></html>
