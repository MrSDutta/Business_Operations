<article class="detail-shell resource-template">
  <div class="eyebrow">{{type}} · {{date}}</div>
  <h1>{{title}}</h1>
  <p class="lead">{{excerpt}}</p>
  {{heroImage}}
  <div class="tag-row">{{tags}}</div>
  <div class="download-panel">
    <div><span class="mono-label">RESOURCE</span><h3>{{title}}</h3><p>Get the resource through Payhip.</p></div>
    <a class="btn btn-dark" href="{{payhipUrl}}" target="_blank" rel="noopener">{{ctaLabel}}</a>
  </div>
</article>
